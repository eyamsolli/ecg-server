services:
  - type: web
    name: ecg-ai-service
    runtime: python
    rootDir: ai_service
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: MODEL_PATH
        value: models/ecg_model.keras
      - key: SCALER_PATH
        value: models/scaler.pkl
